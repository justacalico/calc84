image: ghcr.io/cirruslabs/flutter:stable

variables:
  GIT_DEPTH: "1"

pages:
  script:
    # Pages unique domains serve the site at /, not /$CI_PROJECT_NAME/.
    - flutter build web --release --base-href "/"
    - mv build/web public
  artifacts:
    paths:
      - public
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
